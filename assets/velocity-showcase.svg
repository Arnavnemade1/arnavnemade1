<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="velBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <linearGradient id="branchMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="branchSwarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <pattern id="gridPattern2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.3"/>
    </pattern>

    <filter id="commitGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulsePoint {
      0%, 100% { r: 5; opacity: 1; }
      50% { r: 7.5; opacity: 0.6; }
    }
    .head-commit {
      animation: pulsePoint 2s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="226" rx="14" fill="url(#velBg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="896" height="226" rx="14" fill="url(#gridPattern2)"/>

  <!-- Header Section -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
      // COMMIT VELOCITY &amp; ARCHITECTURE LOG
    </text>
    <text x="0" y="22" fill="#f8fafc" class="sans" font-size="17" font-weight="700">
      High-Frequency Shipping Cadence &amp; Production Verification
    </text>
    <text x="590" y="0" fill="#10b981" class="mono" font-size="11" font-weight="600">
      ● 8+ DEPLOYED REPOSITORIES
    </text>
  </g>

  <!-- Visual Commit Graph & Git Tree -->
  <g transform="translate(36, 85)">
    <!-- Branch Line: main -->
    <path d="M 18 18 L 18 108" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Fork Line: agentic-swarm branch -->
    <path d="M 18 48 C 18 68, 52 58, 52 78 L 52 108" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Merge back Line -->
    <path d="M 52 78 C 52 98, 18 88, 18 108" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>

    <!-- Commit Nodes on Main -->
    <circle cx="18" cy="18" r="5" fill="#38bdf8"/>
    <circle cx="18" cy="48" r="4.5" fill="#38bdf8"/>
    <circle cx="18" cy="78" r="4" fill="#38bdf8"/>
    <circle cx="18" cy="108" r="6" fill="#34d399" filter="url(#commitGlow)" class="head-commit"/>

    <!-- Commit Nodes on Fork Branch -->
    <circle cx="52" cy="78" r="4.5" fill="#c084fc"/>

    <!-- Commit 1 (Latest HEAD) -->
    <g transform="translate(76, 112)">
      <rect x="0" y="-14" width="70" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
      <text x="8" y="0" fill="#34d399" class="mono" font-size="11" font-weight="600">HEAD ➜</text>
      <text x="78" y="0" fill="#38bdf8" class="mono" font-size="11" font-weight="600">b8f21e</text>
      <text x="135" y="0" fill="#f1f5f9" class="sans" font-size="12.5" font-weight="500">feat(arc): multi-agent swarm coordination protocol &amp; live debate arbiter</text>
      <text x="640" y="0" fill="#64748b" class="mono" font-size="10.5">verified</text>
    </g>

    <!-- Commit 2 -->
    <g transform="translate(76, 82)">
      <text x="78" y="0" fill="#a855f7" class="mono" font-size="11" font-weight="600">e50c4a</text>
      <text x="135" y="0" fill="#cbd5e1" class="sans" font-size="12.5" font-weight="400">feat(aegis): formal verification gate — check 6 hospital policy invariants with Z3</text>
      <text x="640" y="0" fill="#64748b" class="mono" font-size="10.5">91 suites</text>
    </g>

    <!-- Commit 3 -->
    <g transform="translate(76, 52)">
      <text x="78" y="0" fill="#818cf8" class="mono" font-size="11" font-weight="600">9c1b3f</text>
      <text x="135" y="0" fill="#94a3b8" class="sans" font-size="12.5" font-weight="400">perf(ace): nightly causal replay arena on 24h streaming orderbook tape</text>
      <text x="640" y="0" fill="#64748b" class="mono" font-size="10.5">outskill</text>
    </g>

    <!-- Commit 4 -->
    <g transform="translate(76, 22)">
      <text x="78" y="0" fill="#64748b" class="mono" font-size="11" font-weight="600">3a789d</text>
      <text x="135" y="0" fill="#94a3b8" class="sans" font-size="12.5" font-weight="400">feat(splice): model-context-protocol (MCP) server for live semantic grounding</text>
      <text x="640" y="0" fill="#64748b" class="mono" font-size="10.5">mcp-core</text>
    </g>
  </g>
</svg>
